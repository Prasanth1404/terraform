  <rect x="310" y="130" width="750" height="500" rx="16" fill="#FFF5EB" stroke="#ED7100" stroke-width="2.5"/>
  <text x="332" y="160" font-size="18" font-weight="700" fill="#A34E00">EKS · lwp-eks-cluster</text>
  <text x="560" y="160" font-size="13" fill="#B85A00">v1.36 · Auto Mode OFF · auth: EKS API</text>

  <rect x="340" y="185" width="330" height="62" rx="10" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/>
  <text x="505" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#A34E00">Control plane</text>
  <text x="505" y="231" text-anchor="middle" font-size="12" fill="#B85A00">Managed by AWS · API server, etcd</text>

  <rect x="720" y="185" width="310" height="62" rx="10" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
