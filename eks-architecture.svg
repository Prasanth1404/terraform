    <rect x="820" y="676" width="16" height="16" rx="3" fill="#EAF3FB" stroke="#147EBA"/><text x="842" y="689">Compute (EC2)</text>
    <rect x="680" y="706" width="16" height="16" rx="3" fill="#FDECEF" stroke="#DD344C"/><text x="702" y="719">IAM permission</text>
    <rect x="820" y="706" width="16" height="16" rx="3" fill="#F8F5FF" stroke="#8C4FFF" stroke-dasharray="3 2"/><text x="842" y="719">Read from aws-common</text>
  </g>
