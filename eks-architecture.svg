  <line x1="505" y1="247" x2="505" y2="278" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>
  <line x1="875" y1="247" x2="875" y2="278" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>

