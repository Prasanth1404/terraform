  <rect x="60" y="188" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
  <text x="160" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#A3152B">lwp-eks-cluster-role</text>
  <text x="160" y="233" text-anchor="middle" font-size="11" fill="#B8293F">AmazonEKSClusterPolicy</text>
  <rect x="60" y="270" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
  <text x="160" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#A3152B">lwp-eks-node-role</text>
  <text x="160" y="315" text-anchor="middle" font-size="11" fill="#B8293F">Worker · CNI · ECR read</text>
  <rect x="60" y="352" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
  <text x="160" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#A3152B">lwp-ebs-csi-role</text>
  <text x="160" y="397" text-anchor="middle" font-size="11" fill="#B8293F">EBS CSI · Pod Identity</text>

  <!-- data sources -->
  <rect x="40" y="470" width="240" height="110" rx="14" fill="#F8F5FF" stroke="#8C4FFF" stroke-width="2" stroke-dasharray="7 5"/>
