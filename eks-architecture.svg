<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5B6472"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#DD344C"/>
    </marker>
  </defs>
  <rect width="1100" height="800" fill="#FFFFFF"/>

  <!-- Top actors -->
  <rect x="340" y="24" width="330" height="62" rx="12" fill="#F1F3F5" stroke="#5B6472" stroke-width="1.5"/>
  <text x="505" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#2B2F36">You (kubectl / Terraform)</text>
  <text x="505" y="71" text-anchor="middle" font-size="12" fill="#5B6472">sgprasanth-terraform + root · cluster admin</text>

  <rect x="720" y="24" width="310" height="62" rx="12" fill="#F1F3F5" stroke="#5B6472" stroke-width="1.5"/>
  <text x="875" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#2B2F36">Website users</text>
  <text x="875" y="71" text-anchor="middle" font-size="12" fill="#5B6472">api / sf / argocd .prasanth.space</text>


  <!-- IAM -->
  <rect x="40" y="140" width="240" height="300" rx="14" fill="#FDECEF" stroke="#DD344C" stroke-width="2"/>
