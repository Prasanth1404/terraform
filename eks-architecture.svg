  <text x="1010" y="305" text-anchor="end" font-size="12" fill="#147EBA">t3.large × 3 · min 3 · max 4 · AL2023</text>
  <g>
    <rect x="360" y="322" width="200" height="108" rx="10" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.5"/>
    <text x="460" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0D5A8C">Node 1</text>
    <text x="460" y="380" text-anchor="middle" font-size="12" fill="#147EBA">lwp-pub-sub-1</text>
    <text x="460" y="400" text-anchor="middle" font-size="12" fill="#147EBA">ap-south-1a</text>
    <rect x="585" y="322" width="200" height="108" rx="10" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.5"/>
    <text x="685" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0D5A8C">Node 2</text>
    <text x="685" y="380" text-anchor="middle" font-size="12" fill="#147EBA">lwp-pub-sub-2</text>
    <text x="685" y="400" text-anchor="middle" font-size="12" fill="#147EBA">ap-south-1b</text>
    <rect x="810" y="322" width="200" height="108" rx="10" fill="#FFFFFF" stroke="#147EBA" stroke-width="1.5"/>
    <text x="910" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0D5A8C">Node 3</text>
    <text x="910" y="380" text-anchor="middle" font-size="12" fill="#147EBA">lwp-pub-sub-3</text>
    <text x="910" y="400" text-anchor="middle" font-size="12" fill="#147EBA">ap-south-1c</text>
  </g>

  <!-- Add-ons -->
  <rect x="340" y="470" width="690" height="130" rx="12" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="360" y="495" font-size="15" font-weight="700" fill="#A34E00">EKS add-ons</text>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#7A3B00">
    <rect x="360" y="508" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="437" y="530">VPC CNI</text>
    <rect x="525" y="508" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="602" y="530">kube-proxy</text>
    <rect x="690" y="508" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="767" y="530">Pod Identity Agent</text>
    <rect x="855" y="508" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="932" y="530">CoreDNS</text>
    <rect x="360" y="552" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="437" y="574">EBS CSI driver</text>
    <rect x="525" y="552" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="602" y="574">metrics-server</text>
    <rect x="690" y="552" width="155" height="34" rx="17" fill="#FFE8D1" stroke="#ED7100"/><text x="767" y="574">cert-manager</text>
  </g>

  <!-- IAM links -->
  <path d="M260 219 H338" fill="none" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <path d="M260 301 H338" fill="none" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <path d="M260 383 H295 V569 H358" fill="none" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <!-- EBS -->
  <line x1="437" y1="586" x2="437" y2="668" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>
  <rect x="340" y="670" width="300" height="62" rx="12" fill="#EAF6DE" stroke="#7AA116" stroke-width="2"/>
  <text x="490" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#2F5A0C">EBS gp3 volumes</text>
  <text x="490" y="716" text-anchor="middle" font-size="12" fill="#3B6D11">MySQL data · product images</text>

  <!-- top arrows (drawn last so they stay visible) -->
  <line x1="505" y1="86" x2="505" y2="183" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>
  <line x1="875" y1="86" x2="875" y2="183" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>

