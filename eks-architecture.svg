  <text x="160" y="524" text-anchor="middle" font-size="12" fill="#6B4BC2">subnets for cluster + nodes:</text>
  <text x="160" y="543" text-anchor="middle" font-size="12" fill="#6B4BC2">lwp-vpc</text>
  <text x="160" y="562" text-anchor="middle" font-size="12" fill="#6B4BC2">lwp-pub-sub-1 / 2 / 3</text>

