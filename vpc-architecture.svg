<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5B6472"/>
    </marker>
  </defs>
  <rect width="1100" height="790" fill="#FFFFFF"/>

  <!-- Internet -->
  <rect x="460" y="20" width="180" height="52" rx="26" fill="#F1F3F5" stroke="#5B6472"/>
  <text x="550" y="51" text-anchor="middle" font-size="16" font-weight="600" fill="#2B2F36">Internet</text>
  <line x1="550" y1="72" x2="550" y2="112" stroke="#5B6472" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- VPC -->
  <rect x="40" y="140" width="1020" height="590" rx="16" fill="#F8F5FF" stroke="#8C4FFF" stroke-width="2.5"/>
  <text x="62" y="172" font-size="18" font-weight="700" fill="#5A2EB8">VPC · lwp-vpc</text>
  <text x="62" y="194" font-size="13" fill="#6B4BC2">172.16.0.0/16 · DNS support + hostnames ON</text>

  <!-- Internet Gateway -->
  <rect x="450" y="114" width="200" height="54" rx="10" fill="#EFE6FF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="550" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#4A21A6">Internet Gateway</text>
  <text x="550" y="156" text-anchor="middle" font-size="12" fill="#6B4BC2">lwp-gw</text>
  <line x1="550" y1="168" x2="550" y2="203" stroke="#5B6472" stroke-width="2" marker-end="url(#a)"/>

  <!-- Public route table -->
  <rect x="420" y="205" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
  <text x="550" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#3B6D11">Public route table · lwp-pub-rt</text>
  <text x="550" y="248" text-anchor="middle" font-size="12" fill="#4F7A1F">0.0.0.0/0 → Internet Gateway</text>
  <!-- public bus -->
  <path d="M550 261 V276 M230 276 H870 M230 276 V323 M550 276 V323 M870 276 V323" fill="none" stroke="#7AA116" stroke-width="2"/>
  <path d="M230 312 V323 M550 312 V323 M870 312 V323" fill="none" stroke="#7AA116" stroke-width="2" marker-end="url(#a)"/>

  <!-- AZ columns -->
  <g font-size="13" font-weight="600" fill="#147EBA">
    <rect x="80" y="290" width="300" height="255" rx="12" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="400" y="290" width="300" height="255" rx="12" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="720" y="290" width="300" height="255" rx="12" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="96" y="310">ap-south-1a</text>
    <text x="416" y="310">ap-south-1b</text>
    <text x="736" y="310">ap-south-1c</text>
  </g>

  <!-- Public subnets -->
  <g>
    <rect x="100" y="325" width="260" height="92" rx="10" fill="#EAF6DE" stroke="#7AA116" stroke-width="2"/>
    <text x="230" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#2F5A0C">lwp-pub-sub-1</text>
    <text x="230" y="373" text-anchor="middle" font-size="13" fill="#3B6D11">172.16.1.0/24</text>
    <text x="230" y="395" text-anchor="middle" font-size="12" fill="#4F7A1F">Public IP · ELB tag · EKS nodes</text>

    <rect x="420" y="325" width="260" height="92" rx="10" fill="#EAF6DE" stroke="#7AA116" stroke-width="2"/>
    <text x="550" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#2F5A0C">lwp-pub-sub-2</text>
    <text x="550" y="373" text-anchor="middle" font-size="13" fill="#3B6D11">172.16.3.0/24</text>
    <text x="550" y="395" text-anchor="middle" font-size="12" fill="#4F7A1F">Public IP · ELB tag · EKS nodes</text>

    <rect x="740" y="325" width="260" height="92" rx="10" fill="#EAF6DE" stroke="#7AA116" stroke-width="2"/>
    <text x="870" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#2F5A0C">lwp-pub-sub-3</text>
    <text x="870" y="373" text-anchor="middle" font-size="13" fill="#3B6D11">172.16.5.0/24</text>
    <text x="870" y="395" text-anchor="middle" font-size="12" fill="#4F7A1F">Public IP · ELB tag · EKS nodes</text>
  </g>

  <!-- Private subnets -->
  <g>
    <rect x="100" y="433" width="260" height="92" rx="10" fill="#E3F4F7" stroke="#00A4A6" stroke-width="2"/>
    <text x="230" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#005F61">lwp-pri-sub-1</text>
    <text x="230" y="481" text-anchor="middle" font-size="13" fill="#00787A">172.16.2.0/24</text>
    <text x="230" y="503" text-anchor="middle" font-size="12" fill="#008C8E">No internet · reserved</text>

    <rect x="420" y="433" width="260" height="92" rx="10" fill="#E3F4F7" stroke="#00A4A6" stroke-width="2"/>
    <text x="550" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#005F61">lwp-pri-sub-2</text>
    <text x="550" y="481" text-anchor="middle" font-size="13" fill="#00787A">172.16.4.0/24</text>
    <text x="550" y="503" text-anchor="middle" font-size="12" fill="#008C8E">No internet · reserved</text>

    <rect x="740" y="433" width="260" height="92" rx="10" fill="#E3F4F7" stroke="#00A4A6" stroke-width="2"/>
    <text x="870" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#005F61">lwp-pri-sub-3</text>
    <text x="870" y="481" text-anchor="middle" font-size="13" fill="#00787A">172.16.6.0/24</text>
    <text x="870" y="503" text-anchor="middle" font-size="12" fill="#008C8E">No internet · reserved</text>
  </g>

  <!-- private bus -->
  <path d="M230 525 V562 M550 525 V562 M870 525 V562 M230 562 H870 M550 562 V575" fill="none" stroke="#00A4A6" stroke-width="2"/>

  <!-- Private route table -->
  <rect x="420" y="575" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#00A4A6" stroke-width="2"/>
  <text x="550" y="599" text-anchor="middle" font-size="14" font-weight="700" fill="#005F61">Private route table · lwp-pri-rt</text>
  <text x="550" y="618" text-anchor="middle" font-size="12" fill="#00787A">Local VPC traffic only (no NAT)</text>

  <!-- Security groups -->
  <rect x="80" y="652" width="300" height="56" rx="10" fill="#FDECEF" stroke="#DD344C" stroke-width="2"/>
  <text x="230" y="676" text-anchor="middle" font-size="14" font-weight="700" fill="#A3152B">lwp-sg</text>
  <text x="230" y="695" text-anchor="middle" font-size="12" fill="#B8293F">Inbound: my IP only</text>

  <rect x="720" y="652" width="300" height="56" rx="10" fill="#FDECEF" stroke="#DD344C" stroke-width="2"/>
  <text x="870" y="676" text-anchor="middle" font-size="14" font-weight="700" fill="#A3152B">lwp-pri-sg</text>
  <text x="870" y="695" text-anchor="middle" font-size="12" fill="#B8293F">Inbound: whole VPC</text>

  <!-- Legend -->
  <g font-size="12" fill="#2B2F36">
    <rect x="80" y="748" width="16" height="16" rx="3" fill="#EAF6DE" stroke="#7AA116"/><text x="102" y="761">Public subnet</text>
    <rect x="220" y="748" width="16" height="16" rx="3" fill="#E3F4F7" stroke="#00A4A6"/><text x="242" y="761">Private subnet</text>
    <rect x="365" y="748" width="16" height="16" rx="3" fill="none" stroke="#147EBA" stroke-dasharray="4 3"/><text x="387" y="761">Availability Zone</text>
    <rect x="530" y="748" width="16" height="16" rx="3" fill="#EFE6FF" stroke="#8C4FFF"/><text x="552" y="761">VPC / gateway</text>
    <rect x="670" y="748" width="16" height="16" rx="3" fill="#FDECEF" stroke="#DD344C"/><text x="692" y="761">Security group</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
